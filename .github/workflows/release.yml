name: Signed production build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name; defaults to the v-tag or 1.0'
        type: string
      version_code:
        description: 'Positive version code; defaults to the workflow run number'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Resolve build version
        id: version
        env:
          REQUESTED_VERSION_NAME: ${{ inputs.version_name }}
          REQUESTED_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY'
          import os, re
          name = os.environ['REQUESTED_VERSION_NAME'] or (
              os.environ['GITHUB_REF_NAME'].removeprefix('v') if os.environ['GITHUB_REF_TYPE'] == 'tag' else '1.0')
          code = os.environ['REQUESTED_VERSION_CODE'] or os.environ['GITHUB_RUN_NUMBER']
          if not re.fullmatch(r'[0-9]+(?:\.[0-9]+){1,3}(?:[-+][0-9A-Za-z.-]+)?', name):
              raise SystemExit('Invalid version name')
          if not code.isascii() or not code.isdigit() or not 1 <= int(code) <= 2_100_000_000:
              raise SystemExit('Invalid version code')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'name={name}\ncode={int(code)}\n')
          PY
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret'; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/steam-enhanced-release.p12"
      - name: Build signed APK and bundle, test and lint
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/steam-enhanced-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseVersionName: ${{ steps.version.outputs.name }}
          ORG_GRADLE_PROJECT_releaseVersionCode: ${{ steps.version.outputs.code }}
        run: >-
          ./gradlew :app:assembleRelease :app:bundleRelease
          :app:testDebugUnitTest :app:lintRelease
          --no-daemon --no-configuration-cache --no-build-cache
      - name: Verify signatures and prepare artifacts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          RELEASE_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, re, subprocess
          output = subprocess.check_output([
              os.environ['ANDROID_HOME'] + '/build-tools/37.0.0/apksigner',
              'verify', '--verbose', '--print-certs', 'app/build/outputs/apk/release/app-release.apk'], text=True)
          certificate = subprocess.check_output(['openssl', 'x509', '-in', 'docs/release-signing-certificate.crt', '-outform', 'DER'])
          signers = re.findall(r'^(?:Signer #[0-9]+|V[0-9.]+ Signer):? certificate SHA-256 digest: ([0-9a-f]+)$', output, re.MULTILINE)
          if not signers or set(signers) != {hashlib.sha256(certificate).hexdigest()}:
              raise SystemExit('APK signing certificate does not match the production certificate')
          print(output)
          PY
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/steam-enhanced-$RELEASE_VERSION-$RELEASE_CODE.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/steam-enhanced-$RELEASE_VERSION-$RELEASE_CODE.aab"
          cp docs/release-signing-certificate.crt dist/
          cd dist
          sha256sum *.apk *.aab > SHA256SUMS
      - name: Upload signed production artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steam-enhanced-release-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/steam-enhanced-release.p12"
